<meta charset="utf-8">
<title>一路推到底</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{
  /* Layout: full-bleed 3D sidewalk; HUD pill pinned top, two thumb pads pinned bottom; menus look like a shop signboard + blue house-number plates */
  --ink:#16212c;
  --glass:rgba(16,26,38,.74);
  --sign:#ffd12e;
  --curb:#e0402d;
  --plate:#1d4f9e;
  --left:#2f80ed;
  --right:#ff8a1f;
  --ok:#3fbf6f;
  --white:#ffffff;
  --sky-top:#8fd0f2;
  --sky-bot:#e3f4fb;
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--white);font-family:var(--font);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky-top),var(--sky-bot) 60%);transition:background .6s}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sign);outline-offset:3px}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:stretch;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto}
.iconbtn{width:44px;min-height:44px;border-radius:12px;background:var(--glass);border:0;color:var(--white);display:grid;place-items:center;padding:0}
.iconbtn svg{width:22px;height:22px}
.prog{flex:1;min-width:0;background:var(--glass);border-radius:12px;padding:6px 12px 8px;display:flex;flex-direction:column;justify-content:center}
.prog .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;white-space:nowrap}
.prog .row span:first-child{overflow:hidden;text-overflow:ellipsis}
.prog .row span:last-child{font-variant-numeric:tabular-nums;opacity:.9}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.18);position:relative;margin-top:6px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--sign);border-radius:4px}
.bar b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--white);border:3px solid var(--plate);left:0}
.bar em{position:absolute;right:-2px;top:-7px;width:4px;height:22px;background:repeating-linear-gradient(180deg,#fff 0 4px,#16212c 4px 8px)}
.hearts{background:var(--glass);border-radius:12px;padding:0 10px;display:flex;align-items:center;gap:2px}
.hearts svg{width:20px;height:20px;transition:transform .2s,opacity .2s}
.hearts svg.lost{opacity:.22;transform:scale(.8)}

.chip{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 66px);background:var(--right);color:var(--ink);
  padding:6px 14px;border-radius:999px;font-size:15px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.3);animation:blink .5s infinite alternate}
.chip.road{background:var(--left);color:var(--white);top:calc(env(safe-area-inset-top,0px) + 102px);animation:none}
@keyframes blink{to{filter:brightness(1.25)}}
.toast{position:fixed;z-index:20;left:0;right:0;top:24%;text-align:center;font-size:28px;line-height:1.25;color:var(--white);pointer-events:none;opacity:0;white-space:pre-line;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),0 0 18px rgba(0,0,0,.4)}
.toast.pop{animation:pop 1.2s ease-out forwards}
.toast.small{font-size:20px}
@keyframes pop{0%{transform:scale(.6);opacity:0}12%{transform:scale(1.08);opacity:1}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.count{position:fixed;left:0;right:0;top:46%;text-align:center;font-size:110px;line-height:1;color:var(--sign);pointer-events:none;
  text-shadow:0 6px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink)}
.count.go{color:var(--white);font-size:80px}
.hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 86px);transform:translateX(-50%);width:min(calc(100vw - 32px),400px);box-sizing:border-box;
  background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:12px 16px;text-align:center;box-shadow:0 5px 0 var(--ink);pointer-events:none;transition:opacity .4s}
.hint b{display:block;font-weight:400;font-size:19px;line-height:1.4;text-wrap:balance}
.hint b .l{color:var(--left)}.hint b .r{color:var(--right)}
.hint small{display:block;margin-top:6px;font-size:12.5px;opacity:.7}
.hint.fade{opacity:0}

/* ---------- thumb pads ---------- */
.pads{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 92px 1fr;gap:10px;align-items:end;touch-action:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pad{height:clamp(104px,17vh,150px);border-radius:28px;border:0;color:var(--white);position:relative;overflow:hidden;touch-action:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;
  box-shadow:0 7px 0 rgba(0,0,0,.38),inset 0 0 0 3px rgba(255,255,255,.28);transition:transform .05s,box-shadow .05s}
.pad.l{background:var(--left)}
.pad.r{background:var(--right)}
.pad.down{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.38),inset 0 0 0 4px rgba(255,255,255,.55)}
.pad svg{width:42px;height:42px}
.pad .lbl{font-size:22px;letter-spacing:.08em}
.pad .sub{font-size:12px;opacity:.9}
.pad .cd{position:absolute;left:0;bottom:0;height:7px;width:0;background:rgba(255,255,255,.75)}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:6px;pointer-events:none}
.gauge{width:88px;height:54px;background:var(--glass);border-radius:44px 44px 12px 12px;padding:4px 4px 0}
.mid small{font-size:11px;opacity:.85;background:var(--glass);border-radius:6px;padding:1px 8px}
.sync{opacity:0;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 170px);transform:translateX(-50%);color:var(--sign);font-size:20px;pointer-events:none;
  text-shadow:0 2px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink)}
.sync.pop{animation:pop .7s ease-out forwards}

/* ---------- menus ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,rgba(22,33,44,0) 0%,rgba(22,33,44,.55) 40%,rgba(22,33,44,.92) 100%);
  padding-block:calc(env(safe-area-inset-top,0px) + 24px) calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;margin:auto 0}
.signboard{background:var(--sign);border:4px solid var(--ink);border-radius:12px;padding:14px 16px 12px;box-shadow:0 7px 0 var(--ink);text-align:center;position:relative}
.signboard::before,.signboard::after{content:"";position:absolute;top:-16px;width:6px;height:14px;background:var(--ink)}
.signboard::before{left:22%}.signboard::after{right:22%}
.signboard h1{margin:0;font-weight:400;font-size:clamp(38px,11vw,52px);line-height:1.05;letter-spacing:.08em;color:var(--curb);text-wrap:balance}
.signboard p{margin:6px 0 0;color:var(--ink);font-size:15px;letter-spacing:.04em}
.plates{display:grid;gap:10px}
.plate{background:var(--plate);color:var(--white);border:3px solid var(--white);outline:3px solid var(--plate);border-radius:8px;
  padding:10px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.plate:active{filter:brightness(1.15)}
.plate .no{font-size:30px;min-width:1.5em;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.plate .no small{display:block;font-size:12px;opacity:.8}
.plate .mid2{min-width:0;flex:1}
.plate .t{font-size:19px;letter-spacing:.04em}
.plate .s{font-size:12px;opacity:.82;margin-top:2px}
.plate .st{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.plate .st span{display:flex}
.plate .st svg{width:13px;height:13px}
.plate .st small{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.plate[disabled]{filter:grayscale(.85);opacity:.55;cursor:not-allowed}
.how{background:var(--glass);border-radius:14px;padding:12px 14px;display:grid;gap:9px;font-size:14px;line-height:1.45}
.how h2{margin:0;font-size:15px;font-weight:400;color:var(--sign);letter-spacing:.06em}
.how .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.key{display:inline-block;padding:2px 9px;border-radius:7px;font-size:13px;color:var(--white);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.key.l{background:var(--left)}.key.r{background:var(--right)}
.how .note{opacity:.82;font-size:12.5px}
.rowbtns{display:flex;gap:10px}
.go{flex:1;background:var(--curb);color:var(--white);border:0;border-radius:14px;font-size:21px;padding:13px;box-shadow:0 5px 0 #8f2216;letter-spacing:.08em}
.go.alt{background:var(--white);color:var(--ink);box-shadow:0 5px 0 #8a96a3;font-size:17px}
.go.blue{background:var(--left);box-shadow:0 5px 0 #1a4f96}
.go:active{transform:translateY(3px)}
.tiny{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.85;gap:10px}
.tiny button{background:var(--glass);color:var(--white);border:0;border-radius:999px;padding:6px 12px;font-size:13px;flex-shrink:0}
.timebig{text-align:center;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;color:var(--white);text-shadow:0 4px 0 var(--ink)}
.timebig small{font-size:20px;margin-left:4px}
.bigstars{display:flex;justify-content:center;gap:4px}
.bigstars svg{width:38px;height:38px}
.rating{text-align:center;font-size:18px;color:var(--sign);margin-top:-4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--plate);border:2px solid var(--white);border-radius:8px;padding:8px 6px;text-align:center}
.stats b{display:block;font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;opacity:.85}
.fact{background:var(--glass);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;border-left:5px solid var(--sign)}
.screen.result{padding-left:0;padding-right:0;padding-top:env(safe-area-inset-top,0px);background:var(--ink)}
.res{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px;margin:0 auto}
.resimg{display:block;width:100%;max-width:100%;aspect-ratio:4/5;object-fit:cover;background:var(--ink);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.respad{display:flex;flex-direction:column;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rowbtns.small .go{font-size:15px;padding:10px}
.resline{text-align:center;font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.toast.pop,.sync.pop{animation-duration:.01s}.chip{animation:none}}
@media (min-aspect-ratio:4/3){
  .pads{grid-template-columns:minmax(0,220px) 1fr minmax(0,220px)}
  .pad{height:clamp(96px,26vh,140px)}
}
</style>

<div id="app">
  <canvas id="gl"></canvas>

  <div class="hud" id="hud" hidden>
    <button class="iconbtn" id="btnPause" aria-label="暫停">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
    </button>
    <div class="prog">
      <div class="row"><span id="lvName">第1關</span><span id="dist">0.0 秒</span></div>
      <div class="bar"><i id="progFill"></i><em></em><b id="progDot"></b></div>
    </div>
    <div class="hearts" id="hearts"></div>
  </div>

  <div class="chip" id="chipBehind" hidden>叮叮！後面有腳踏車</div>
  <div class="chip road" id="chipRoad" hidden>在馬路上！往前找坡道</div>
  <div class="hint" id="hint" hidden>
    <b>配合<span class="l">左</span><span class="r">右</span>手的節奏，保持輪椅前進方向吧！</b>
    <small>電腦操作，可以左右方向鍵進行操作</small>
  </div>
  <div class="toast" id="toast"></div>
  <div class="count" id="count" hidden></div>
  <div class="sync" id="sync">雙手同步！</div>

  <div class="pads" id="pads" hidden>
    <button class="pad l" id="padL" aria-label="左手推">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5"><circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="11" stroke-width="2"/><path d="M24 7v34M7 24h34" stroke-width="2"/><path d="M33 4l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lbl">左手推</span><span class="sub">車頭往右偏</span><i class="cd" id="cdL"></i>
    </button>
    <div class="mid">
      <svg class="gauge" viewBox="0 0 100 60" aria-hidden="true">
        <path d="M12 56 A38 38 0 0 1 88 56" stroke="rgba(255,255,255,.22)" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M40.2 19.3 A38 38 0 0 1 59.8 19.3" stroke="#3fbf6f" stroke-width="9" fill="none"/>
        <g id="needle"><line x1="50" y1="56" x2="50" y2="22" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="56" r="5" fill="#fff"/></g>
      </svg>
      <small>車頭方向</small>
    </div>
    <button class="pad r" id="padR" aria-label="右手推">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5"><circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="11" stroke-width="2"/><path d="M24 7v34M7 24h34" stroke-width="2"/><path d="M15 4l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="lbl">右手推</span><span class="sub">車頭往左偏</span><i class="cd" id="cdR"></i>
    </button>
  </div>

  <!-- menu -->
  <div class="screen" id="menu">
    <div class="card">
      <div class="signboard"><h1>一路推到底</h1><p>台灣人行道輪椅挑戰</p></div>
      <div class="plates" id="plates"></div>
      <div class="how">
        <h2>怎麼推</h2>
        <div class="r"><span class="key l">左手推</span>推左輪，車頭往<b>右</b>偏</div>
        <div class="r"><span class="key r">右手推</span>推右輪，車頭往<b>左</b>偏</div>
        <div class="r"><span class="key l">左</span><span class="key r">右</span>輪流或一起按，才能直直前進</div>
        <div class="note">撞到機車、攤販、路人或腳踏車會少一顆愛心。摔下人行道不扣愛心，但要在馬路上推到有坡道的地方才能回來。電腦可用 ← → 方向鍵。</div>
      </div>
      <div class="tiny"><span>越快、越穩、越少碰撞，星星越多（滿分五顆）</span><button id="btnMute1">音樂：開</button></div>
    </div>
  </div>

  <!-- pause -->
  <div class="screen" id="pause" hidden>
    <div class="card">
      <div class="signboard"><h1>暫停</h1><p>喘口氣，手臂休息一下</p></div>
      <div class="rowbtns"><button class="go" id="btnResume">繼續推</button></div>
      <div class="rowbtns"><button class="go alt" id="btnRetryP">重來</button><button class="go alt" id="btnQuitP">選關卡</button></div>
      <div class="tiny"><span></span><button id="btnMute2">音樂：開</button></div>
    </div>
  </div>

  <!-- result: the highlight card fills the width, actions below -->
  <div class="screen result" id="result" hidden>
    <div class="res">
      <img class="resimg" id="resImg" alt="這一局最精彩瞬間的成績圖">
      <div class="respad">
        <div class="rowbtns"><button class="go alt" id="btnSave">儲存圖片</button><button class="go blue" id="btnShare">分享到社群</button></div>
        <div class="rowbtns"><button class="go" id="btnRetry">再玩一次</button></div>
        <div class="rowbtns small"><button class="go alt" id="btnNext">下一關</button><button class="go alt" id="btnQuit">選關卡</button></div>
        <div class="resline" id="resLine"></div>
        <div class="fact" id="resFact"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  { name:'捷運站前', sub:'施工、電箱，還有後面來的車', goal:'捷運電梯', len:170, gap:[6,9], ped:4.0, bike:7, bikeBack:0.45, camber:0.17, theme:'noon', rampEvery:34,
    w:{scooters:3, construction:2, box:1.5, aboard:1.5, tree:1.4, pole:1.4, mailbox:0.8, bump:1.6, ramp:1.4, stall:1} },
];

// ---------- materials & geometry (soft, rounded "clay" look) ----------
const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
const matCache = {};
function M(color, extra){
  const key = color + (extra ? JSON.stringify(extra) : '');
  if (!matCache[key]) {
    const o = Object.assign({ roughness:0.78, metalness:0 }, extra || {});
    if (o.emissive != null) o.emissive = lin(o.emissive);
    matCache[key] = new THREE.MeshStandardMaterial(Object.assign(o, { color:lin(color) }));
  }
  return matCache[key];
}
const geoCache = {};
function keepGeo(key, make){ let g = geoCache[key]; if (!g) { g = make(); g.userData.keep = true; geoCache[key] = g; } return g; }
// Rounded box: an octant-split sphere pushed out to the box corners. r = corner radius.
function rboxGeo(w, h, d, r){
  r = Math.max(0.005, Math.min(r, w / 2, h / 2, d / 2) * 0.999);
  return keepGeo(`rb${w.toFixed(3)}|${h.toFixed(3)}|${d.toFixed(3)}|${r.toFixed(3)}`, () => {
    const g = new THREE.SphereGeometry(1, 16, 12);
    const p = g.attributes.position, ix = w / 2 - r, iy = h / 2 - r, iz = d / 2 - r;
    const sg = v => Math.abs(v) < 1e-6 ? 0 : Math.sign(v);
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      p.setXYZ(i, x * r + sg(x) * ix, y * r + sg(y) * iy, z * r + sg(z) * iz);
    }
    g.computeBoundingSphere(); g.computeBoundingBox();
    return g;
  });
}
const sphGeo = (r, ws = 18, hs = 12) => keepGeo(`s${r.toFixed(3)}|${ws}|${hs}`, () => new THREE.SphereGeometry(r, ws, hs));
const torGeo = (r, t) => keepGeo(`t${r}|${t}`, () => new THREE.TorusGeometry(r, t, 10, 30));
const cylGeo = (rt, rb, h, s = 16) => keepGeo(`c${rt}|${rb}|${h}|${s}`, () => new THREE.CylinderGeometry(rt, rb, h, s));
function addMesh(geo, mat, x, y, z, parent, cast = true){
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = true; if (parent) parent.add(m); return m;
}
const toMat = c => typeof c === 'number' ? M(c) : c;
const rbox = (w, h, d, r, c, x, y, z, p, cast) => addMesh(rboxGeo(w, h, d, r), toMat(c), x, y, z, p, cast);
const box = (w, h, d, c, x, y, z, p, cast) => addMesh(new THREE.BoxGeometry(w, h, d), toMat(c), x, y, z, p, cast);
const cyl = (rt, rb, h, c, x, y, z, p, seg = 16, cast) => addMesh(cylGeo(rt, rb, h, seg), toMat(c), x, y, z, p, cast);
const sph = (r, c, x, y, z, p, cast) => addMesh(sphGeo(r), toMat(c), x, y, z, p, cast);
function flat(w, d, mat, x, y, z, p){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; p.add(m); return m;
}
function facing(w, h, mat, x, y, z, p){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); p.add(m); return m;
}

const texCache = {};
function canvasTex(key, w, h, draw, repeat){
  if (texCache[key]) return texCache[key];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  texCache[key] = t; return t;
}
function tileTex(kind){
  return canvasTex('tile' + kind, 256, 256, (g, w, h) => {
    const tones = kind === 'brick' ? ['#c4634a','#d0735a','#b95a43','#cb6b52'] : ['#b3b0a9','#c0bcb4','#a8a59f','#bab6ae'];
    g.fillStyle = kind === 'brick' ? '#9a4a37' : '#8a8780'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      g.fillStyle = tones[(i * 2 + j + (i ? 1 : 0)) % 4];
      const x = i * 128 + 5, y = j * 128 + 5;
      g.beginPath(); if (g.roundRect) g.roundRect(x, y, 118, 118, 10); else g.rect(x, y, 118, 118); g.fill();
      g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(x + 6, y + 6, 106, 10);
    }
  }, true);
}
const windowTex = () => canvasTex('win', 128, 128, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#6f8aa3'); gr.addColorStop(1, '#3b4d60');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.2)'; g.fillRect(10, 8, 30, 100);
  g.strokeStyle = '#f1f0ea'; g.lineWidth = 5;
  for (let x = 0; x <= w; x += 21) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (let y = 0; y <= h; y += 42) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  g.lineWidth = 8; g.strokeRect(0, 0, w, h);
});

function signTex(text, bg, fg, vertical){

// ---------- optional GLB models (e.g. made in Tripo or Blender) ----------
// Put .glb files in ./models/ and list them in ./models/manifest.json, e.g.
// { "scooter": { "files": ["scooter.glb"] }, "ped": { "files": ["ped1.glb", "ped2.glb"] } }
// Each model is scaled to the height below, set on the ground and turned to face +X.
// glTF models usually face +Z, hence the default rotY; override per key in the manifest.
const ASSET_DEFAULTS = {
  ped:{ h:1.5 }, phone:{ h:1.5 }, elder:{ h:1.35 }, bike:{ h:1.75 }, scooter:{ h:1.2 },
  stall:{ h:2.6 }, mailbox:{ h:1.2 }, tree:{ h:4.2 }, plant:{ h:0.9 }, ebox:{ h:1.3 }, cone:{ h:0.55 }, aboard:{ h:1.0 },
};
const assets = {};
function normaliseAsset(src, cfg){
  const root = new THREE.Group();
  const inner = src.clone(true);
  inner.rotation.y = cfg.rotY != null ? cfg.rotY : -Math.PI / 2;
  root.add(inner);
  let b = new THREE.Box3().setFromObject(root);
  const s = cfg.h / Math.max(0.001, b.max.y - b.min.y);
  inner.scale.multiplyScalar(s);
  b = new THREE.Box3().setFromObject(root);
  const c = b.getCenter(new THREE.Vector3());
  inner.position.x -= c.x; inner.position.z -= c.z; inner.position.y -= b.min.y;
  root.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; if (n.geometry) n.geometry.userData.keep = true; } });
  return root;
}
async function loadAssets(){
  if (!THREE.GLTFLoader) return;
  let man;
  try { const r = await fetch('models/manifest.json', { cache:'no-cache' }); if (!r.ok) return; man = await r.json(); } catch (e) { return; }
  const loader = new THREE.GLTFLoader();
  const jobs = [];
  for (const key in man) {
    const cfg = Object.assign({}, ASSET_DEFAULTS[key] || { h:1 }, man[key]);
    for (const f of cfg.files || []) {
      jobs.push(new Promise(res => loader.load('models/' + f, gl => { (assets[key] = assets[key] || []).push(normaliseAsset(gl.scene, cfg)); res(); }, undefined, () => res())));
    }
  }
  await Promise.all(jobs);
}
const asset = key => assets[key] && assets[key].length ? rpick(assets[key]).clone(true) : null;

const SHIRTS = [0xe86a5c, 0x5b9be6, 0x7cc47a, 0xf5b94e, 0xb38ad6, 0xfdfdf7, 0x41566e, 0xf0904a, 0x4cc3ad, 0xf7c4d2];
const PANTS = [0x3b4d6b, 0x4a4a52, 0x7a6a58, 0x2f3f5c, 0x9aa0aa, 0x5b5b66];
const SKINS = [0xf6d0ab, 0xe9b48c, 0xd29a70, 0xf8dcc2];
const HAIRS = [0x2a211c, 0x3b2a20, 0x4f3524, 0x1e1e22, 0x6b4428];
function chibiHead(parent, skin, hairC, y){
  const head = new THREE.Group(); head.position.y = y; parent.add(head);
  sph(0.25, skin, 0, 0.2, 0, head);
  const hair = addMesh(new THREE.SphereGeometry(0.268, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.52), M(hairC), -0.025, 0.215, 0, head);
  hair.rotation.z = 0.42;
  for (const s of [-1, 1]) {
    const eye = sph(0.034, 0x1c1714, 0.232, 0.2, s * 0.09, head, false); eye.scale.set(0.55, 1.25, 1);
    sph(0.011, 0xffffff, 0.252, 0.222, s * 0.083, head, false);
    const bl = sph(0.045, M(0xff9aa2, { roughness:1 }), 0.205, 0.12, s * 0.155, head, false); bl.scale.set(0.35, 0.55, 1.1);
  }
  rbox(0.02, 0.022, 0.06, 0.01, 0x8a3b32, 0.243, 0.1, 0, head, false);
  return head;
}
function makeChibi(o = {}){
  const g = new THREE.Group();
  const skin = o.skin || rpick(SKINS), shirt = o.shirt || rpick(SHIRTS), pants = o.pants || rpick(PANTS);
  const hairC = o.hair || rpick(HAIRS);
  const legs = [], arms = [];
  const body = new THREE.Group(); g.add(body);
  if (!o.seated) {
    for (const s of [-1, 1]) {
      const leg = new THREE.Group(); leg.position.set(0, 0.38, s * 0.1); g.add(leg);
      rbox(0.14, 0.36, 0.14, 0.065, pants, 0, -0.17, 0, leg);
      rbox(0.2, 0.09, 0.15, 0.045, 0x3a3330, 0.03, -0.34, 0, leg);
      legs.push(leg);
    }
    body.position.y = 0.36;
  }
  rbox(0.34, 0.46, 0.42, 0.16, shirt, 0, 0.24, 0, body);
  const head = chibiHead(body, skin, hairC, 0.46);
  for (const s of [-1, 1]) {
    const a = new THREE.Group(); a.position.set(0, 0.4, s * 0.25); body.add(a);
    rbox(0.11, 0.3, 0.11, 0.055, shirt, 0, -0.12, 0, a);
    sph(0.06, skin, 0, -0.29, 0, a, false);
    arms.push(a);
  }
  return { g, body, head, legs, arms, skin, shirt, pants };
}
function makePerson(kind){
  const glb = asset(kind) || (kind === 'normal' ? asset('ped') : null);
  if (glb) { const g = new THREE.Group(); g.add(glb); return { g, legs:[], arms:[], body:glb, head:null, glb:true }; }
  const p = makeChibi(kind === 'elder' ? { hair:0xdedbd4 } : {});

    const cart = new THREE.Group(); cart.position.set(0.55, 0, 0); p.g.add(cart);

  sph(0.055, M(rimColor, { roughness:0.4 }), 0, 0, 0, w);
  sph(0.03, 0xffffff, 0.245, 0, side * 0.05, w, false);
  return w;
}

  rbox(0.1, 0.72, CURB_Z - WALL_Z, 0.05, 0xe0402d, 0, 2.9, 0, fg, false);

function scoreRun(){
  const par = LV.len / 1.75;
  let sc = 100;
  sc -= S.hits * 15;
  sc -= S.falls * 7;
  sc -= Math.min(30, Math.max(0, S.time - par));
  sc -= Math.min(15, (S.hAbs / Math.max(1, S.time)) * 40);
  sc = clamp(Math.round(sc), 0, 100);
  const stars = sc >= 90 ? 5 : sc >= 75 ? 4 : sc >= 58 ? 3 : sc >= 40 ? 2 : 1;
  return { sc, stars };
}
let lastResult = null;
function endRun(won){
  S.mode = 'end'; S.won = won; S.endT = 0;
  $('#chipRoad').hidden = true; $('#chipBehind').hidden = true; $('#hint').hidden = true;
  const base = { won, level:levelIndex, time:S.time, hits:S.hits, falls:S.falls, dist:Math.floor(clamp(S.x, 0, LV.len)) };
  if (won) {
    sfx.win();
    const { sc, stars } = scoreRun();
    lastResult = Object.assign(base, { stars, score:sc });
    save.stars[levelIndex] = Math.max(save.stars[levelIndex], stars);
    if (!save.best[levelIndex] || S.time < save.best[levelIndex]) save.best[levelIndex] = +S.time.toFixed(1);
    save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, levelIndex + 2));
    persist();
    moment(40, '衝過終點！', S.x + 0.6, S.z);
  } else {
    sfx.lose();

}

// Exciting things (near misses, crashes, falls, the finish) ask for a shot; the best-scoring one becomes the share card.
const shotCam = new THREE.PerspectiveCamera(50, 1, 0.1, 120);
let best = null, pendingShot = null, lastShotAt = -1e9;
function moment(score, label, fx, fz){
  if (best && score < best.score) return;
  if (pendingShot && score < pendingShot.score) return;
  pendingShot = { score, label, fx:fx != null ? fx : S.x, fz:fz != null ? fz : S.z };
}
function captureMoment(p){
  if (best && p.score <= best.score && perfNow - lastShotAt < 350) return;
  lastShotAt = perfNow;
  const aspect = canvas.width / canvas.height;
  const mx = (S.x + p.fx) / 2, mz = (S.z + p.fz) / 2;
  const spread = Math.min(3, Math.hypot(S.x - p.fx, S.z - p.fz));
  // high and slightly ahead, so kerbside clutter stays below the line of sight and the rider's face shows
  shotCam.position.set(mx + 1.0, 3.2 + S.y + spread * 0.25, mz + 2.3 + spread * 0.5);
  shotCam.lookAt(mx, 0.55 + S.y, mz);
  shotCam.aspect = aspect;
  // aim for a ~55 degree wide 4:5 crop from the middle of the canvas
  shotCam.fov = aspect < 0.8 ? 2 * Math.atan(Math.tan(27.5 * Math.PI / 180) / aspect) * 180 / Math.PI : 66;
  shotCam.updateProjectionMatrix();
  const vis = chair.g.visible, av = chair.arrow.visible;
  chair.g.visible = true; chair.arrow.visible = false;
  renderer.render(scene, shotCam);
  const img = document.createElement('canvas'); img.width = 864; img.height = 1080;
  const g = img.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 1080); gr.addColorStop(0, TH.top); gr.addColorStop(1, TH.bot);
  g.fillStyle = gr; g.fillRect(0, 0, 864, 1080);
  const sw = canvas.width, sh = canvas.height, cw = Math.min(sw, sh * 0.8), ch = cw / 0.8;
  try { g.drawImage(canvas, (sw - cw) / 2, (sh - ch) / 2, cw, ch, 0, 0, 864, 1080); } catch (e) {}
  chair.g.visible = vis; chair.arrow.visible = av;
  renderer.render(scene, camera);
  best = { score:p.score, label:p.label, img };
}

function freeLaneFor(x, z, dir, look){

}

function updatePeds(dt){

  const rig = camRig();
  let fov = rig.fov;
  if (S.mode === 'menu') {
    const a = perfNow * 0.00018;
    _tp.set(S.x + 1.6 + Math.cos(a) * 1.5, 2.2, S.z + 3.4 + Math.sin(a) * 0.6);
    _tl.set(S.x + 0.6, 0.8, S.z - 0.2);
    fov = 55;
  } else if (S.mode === 'end' && S.won) {
    _tp.set(S.x + 3.2, 2.0 + S.y, S.z + 3.0);
    _tl.set(S.x + 0.2, 0.8 + S.y, S.z);
    fov = 50;
  } else {
    const zf = S.onRoad ? 0.55 : 0.3;
    _tp.set(S.x + rig.ox, rig.oy, rig.oz + S.z * zf);
    _tl.set(S.x + rig.lx, 0, rig.lz + S.z * zf);
  }
  if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = S.snap ? fov : lerp(camera.fov, fov, 0.08); camera.updateProjectionMatrix(); }
  const k = S.snap ? 1 : 1 - Math.exp(-dt * (S.mode === 'menu' ? 1.5 : S.mode === 'end' ? 2.5 : 4));
  S.snap = false;
  camPos.lerp(_tp, k); camLook.lerp(_tl, k);
  camera.position.copy(camPos);
  if (S.shake > 0 && !REDUCED) camera.position.add(new THREE.Vector3((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake * 0.6, 0));
  camera.lookAt(camLook);
  S.shake = Math.max(0, S.shake - dt * 1.4);
  sun.position.set(S.x - 5, 12, S.z + 7); sun.target.position.set(S.x + 2, 0, S.z);
}

// ---------- chair visuals ----------
let wheelAngL = 0, wheelAngR = 0;
function updateChairVisual(dt){
  const vl = S.v - S.w * 0.31, vr = S.v + S.w * 0.31;
  wheelAngL -= vl * dt / 0.33; wheelAngR -= vr * dt / 0.33;
  chair.wl.rotation.z = wheelAngL; chair.wr.rotation.z = wheelAngR;
  chair.arms.L.rotation.z = hands.L.arm; chair.arms.R.rotation.z = hands.R.arm;
  const ty = S.onRoad ? ROAD_Y : 0;
  S.y = lerp(S.y, ty, 1 - Math.exp(-dt * (S.onRoad ? 18 : 8)));
  S.roll = lerp(S.roll, 0, 1 - Math.exp(-dt * 5));
  chair.g.position.set(S.x, S.y, S.z);
  chair.g.rotation.set(S.roll, S.h, 0, 'YXZ');
  chair.body.position.y = Math.sin(perfNow * 0.003) * 0.006;
  chair.rider.head.rotation.z = S.mode === 'end' && S.won ? Math.sin(perfNow * 0.01) * 0.12 : 0;
  chair.arrow.visible = S.mode === 'play';
  chair.arrow.material.opacity = 0.35 + Math.min(0.4, Math.abs(S.v) * 0.2);
  chair.g.visible = S.inv > 0 && S.mode === 'play' ? Math.floor(S.inv * 12) % 2 === 0 : true;
}

// ---------- HUD ----------
const needle = $('#needle');
function updateHUD(){
  const p = clamp(S.x / LV.len, 0, 1);
  $('#progFill').style.width = p * 100 + '%';
  $('#progDot').style.left = p * 100 + '%';
  $('#dist').textContent = `${S.time.toFixed(1)} 秒`;
  const deg = clamp(-S.h * 180 / Math.PI, -80, 80);
  needle.setAttribute('transform', `rotate(${deg.toFixed(1)} 50 56)`);
}

// ---------- main loop ----------
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  step(now);
}
function step(now){
  perfNow = now;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.mode === 'paused') { renderer.render(scene, camera); return; }

  if (S.mode === 'countdown') {
    S.cd -= dt;
    const c = $('#count');
    const label = S.cd > 2.6 ? '' : S.cd > 1.8 ? '3' : S.cd > 1.0 ? '2' : S.cd > 0.2 ? '1' : '出發！';
    if (label !== lastCount) { lastCount = label; c.hidden = !label; c.textContent = label; c.className = 'count' + (label.length > 1 ? ' go' : ''); if (label) sfx.beep(label.length > 1); }
    if (S.cd <= -0.5) { c.hidden = true; S.mode = 'play'; S.hintT = 2.5; }
    updateHands(dt);
  } else if (S.mode === 'play') {
    S.time += dt;
    if (S.hintT > 0) { S.hintT -= dt; if (S.hintT <= 0.4) $('#hint').classList.add('fade'); if (S.hintT <= 0) $('#hint').hidden = true; }
    updateHands(dt);
    updatePlayer(dt);
    if (S.mode === 'play') {
      S.pedT -= dt; if (S.pedT <= 0) { spawnPed(); S.pedT = LV.ped * rnd(0.6, 1.4); }
      S.bikeT -= dt; if (S.bikeT <= 0) { spawnBike(); S.bikeT = LV.bike * rnd(0.7, 1.3); }
    }
  } else if (S.mode === 'end') {
    S.endT += dt;
    updateHands(dt);
    S.v *= Math.exp(-dt * 2.5); S.x += S.v * dt * Math.cos(S.h); S.z -= S.v * dt * Math.sin(S.h);
    S.z = clamp(S.z, WALL_Z + CHAIR_R, S.onRoad ? ROAD_MAX : CURB_Z - 0.1);
  } else {
    updateHands(dt);
  }
  if (S.mode !== 'menu') { updatePeds(dt); updateBikes(dt); }
  updateTraffic(dt); updateFloaters(dt); updateRampGlow();
  updateChairVisual(dt);
  updateCamera(dt);
  if (S.mode !== 'menu') updateHUD();
  renderer.render(scene, camera);
  if (pendingShot) { const p = pendingShot; pendingShot = null; captureMoment(p); }
  if (S.capture && S.mode === 'end' && S.endT > (S.won ? 1.1 : 1.0)) { S.capture = false; buildShareCard(); showResult(); }
}

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ---------- boot ----------
async function boot(){
  try { await Promise.race([document.fonts.load('40px Huninn'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  await Promise.race([loadAssets(), new Promise(r => setTimeout(r, 6000))]);
  resize();
  setMuted(!!save.muted);
  toMenu();
  requestAnimationFrame(t => { last = t; frame(t); });
}
if (location.hash === '#debug') window.__game = { S, hands, startLevel, buildLevel, LEVELS, press, statics:() => statics, peds:() => peds, bikes:() => bikes, ramps:() => ramps,
  sim(sec, bot){ let t = last; for (let i = 0; i < sec * 60; i++) { t += 1000 / 60; if (bot) bot(S, i); step(t); } last = performance.now(); } };
boot();
})();
</script>
